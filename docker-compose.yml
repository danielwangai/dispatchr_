services:
  postgres:
    image: postgres:17-alpine
    container_name: dispatchr-postgres
    environment:
      POSTGRES_USER: ${DISPATCHR_DB_USER}
      POSTGRES_PASSWORD: ${DISPATCHR_DB_PASSWORD}
      POSTGRES_DB: ${DISPATCHR_DB_NAME}
    ports:
      - "${DISPATCHR_DB_PORT}:5432"
    volumes:
      - dispatchr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    entrypoint: ["migrate"]

volumes:
  dispatchr-postgres-data:
